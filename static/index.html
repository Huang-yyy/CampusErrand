<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusErrand 校园代跑悬赏</title>
<style>
  :root { --brand:#1a4fb0; --ok:#1a9e5c; --warn:#dc8a00; }
  * { box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",system-ui,sans-serif; margin:0; background:#f5f7fa; color:#222; }
  header { background:var(--brand); color:#fff; padding:14px 20px; }
  header h1 { margin:0; font-size:20px; }
  main { max-width:860px; margin:20px auto; padding:0 16px; }
  .card { background:#fff; border:1px solid #e2e6ed; border-radius:10px; padding:16px 18px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  label { display:block; font-size:13px; color:#666; margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:8px 10px; border:1px solid #ccd3e0; border-radius:6px; font-size:14px; font-family:inherit; }
  .row { display:flex; gap:12px; } .row > div { flex:1; }
  button { background:var(--brand); color:#fff; border:0; border-radius:6px; padding:9px 16px; font-size:14px; cursor:pointer; }
  button.sm { padding:5px 10px; font-size:13px; }
  button.green { background:var(--ok); }
  button.ghost { background:#fff; color:var(--brand); border:1px solid var(--brand); }
  .badge { display:inline-block; padding:2px 9px; border-radius:12px; font-size:12px; background:#eef2fa; color:#345; }
  .badge.open { background:#eaf6 ff; color:#0a7}
  .errand { border:1px solid #e8ecf3; border-left:4px solid var(--brand); border-radius:8px; padding:12px 14px; margin-bottom:10px; }
  .errand .meta { font-size:12px; color:#677;
  }
  .err { color:#c33; font-size:13px; margin-top:6px; min-height:16px;}
  .ok { color:var(--ok); font-size:13px; }
  .tag-pill { display:inline-block; padding:1px 8px; margin:2px 4px 0 0; border-radius:10px;
              font-size:12px; background:#fff3e0; color:#b26a00; border:1px solid #ffd8a8; }
  .filter-bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .filter-bar select, .filter-bar input { width:auto; min-width:110px; padding:6px 8px; font-size:13px; }
  .filter-bar input[type=text] { flex:1; min-width:140px; }
  .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex;
                align-items:center; justify-content:center; z-index:50; }
  .modal { background:#fff; border-radius:12px; width:min(560px,92vw); max-height:84vh;
           display:flex; flex-direction:column; overflow:hidden; }
  .modal h4 { margin:0; padding:14px 18px; border-bottom:1px solid #eee; display:flex;
              justify-content:space-between; align-items:center; }
  .modal .body { padding:14px 18px; overflow:auto; }
  .chat-log { border:1px solid #e2e6ed; border-radius:8px; height:280px; overflow:auto;
              padding:10px; background:#fafbfc; margin-bottom:10px; }
  .bubble { max-width:75%; padding:7px 11px; border-radius:12px; margin:6px 0; font-size:14px;
            word-break:break-all; white-space:pre-wrap; }
  .bubble.me { background:var(--brand); color:#fff; margin-left:auto; }
  .bubble.other { background:#eef1f6; color:#222; }
  .bubble .who { font-size:11px; opacity:.75; display:block; margin-bottom:2px; }
  .match-row { display:flex; justify-content:space-between; align-items:center; padding:10px 12px;
               border:1px solid #e8ecf3; border-radius:8px; margin-bottom:8px; }
  .rank-no { display:inline-block; width:24px; height:24px; line-height:24px; text-align:center;
             border-radius:50%; background:var(--brand); color:#fff; font-size:12px; margin-right:8px; }
  footer { text-align:center; color:#9aa; font-size:12px; padding:18px; }
</style>
</head>
<body>
<header style="display:flex;justify-content:space-between;align-items:center;gap:12px">
  <div>
    <h1>CampusErrand · 校园代跑悬赏平台</h1>
    <div style="margin-top:6px;font-size:12px;opacity:.9">顺路帮带 · 校园代跑 · 悬赏制</div>
  </div>
  <a href="/admin" style="color:#fff;font-size:13px;opacity:.9;text-decoration:none;border:1px solid rgba(255,255,255,.55);padding:6px 13px;border-radius:6px;white-space:nowrap">🛡 平台审核后台</a>
</header>
<main>
  <!-- 身份 -->
  <div class="card">
    <h3>我的身份</h3>
    <div class="row" id="row_id">
      <div><label>姓名</label><input id="me_name" placeholder="小明"></div>
      <div><label>学号</label><input id="me_sid" placeholder="1230001234"></div>
    </div>
    <div style="margin-top:10px">
      <button id="btn_login">登录 / 注册</button>
      <button id="btn_recharge" class="ghost" style="margin-left:8px">充值</button>
      <span id="me_info" class="ok" style="margin-left:12px"></span>
      <button id="btn_logout" class="ghost" style="margin-left:8px;display:none">退出</button>
    </div>
  </div>

  <!-- 发布 -->
  <div class="card">
    <h3>发布代跑任务</h3>
    <div class="row">
      <div><label>取件地址（具体到驿站）</label><input id="f_pickup" placeholder="如：横琴菜鸟驿站（口岸店）"></div>
      <div><label>送达</label>
        <select id="f_delivery"><option>宿舍（校内）</option><option>擎天会</option></select>
      </div>
    </div>
    <div class="row">
      <div><label>类型</label>
        <select id="f_cat"><option value="parcel">包裹</option><option value="meal">外卖</option><option value="print">打印</option><option value="shopping">跨境代购</option></select>
      </div>
      <div><label>物件大小</label>
        <select id="f_size"><option value="small">小件</option><option value="medium" selected>中件</option><option value="large">大件</option></select>
      </div>
    </div>
    <div class="row">
      <div><label>悬赏(¥)</label><input id="f_bounty" type="number" value="8" min="1"></div>
      <div><label>任务标签(逗号分隔,可留空)</label>
        <input id="f_tags" placeholder="如:急单, 易碎, 生鲜"></div>
    </div>
    <label>包裹内容申报(必填 · 审核详情仅你与平台可见,不向接单者与其他人公开)</label>
    <textarea id="f_content" rows="2" placeholder="如:衣服、书本、零食(食品需密封)…请如实申报"></textarea>
    <label>说明</label><textarea id="f_desc" rows="2" placeholder="包裹在横琴快递站,取件码接单后显示"></textarea>
    <div style="margin-top:10px"><button id="btn_post">发布</button><span class="err" id="post_err"></span></div>
  </div>

  <!-- 列表 -->
  <div class="card">
    <h3>待办任务 <button class="sm ghost" id="btn_refresh">刷新</button></h3>
    <div class="filter-bar">
      <select id="flt_cat">
        <option value="">全部分类</option>
        <option value="parcel">包裹</option>
        <option value="meal">外卖</option>
        <option value="print">打印</option>
        <option value="shopping">跨境代购</option>
      </select>
      <select id="flt_size">
        <option value="">全部大小</option>
        <option value="small">小件</option>
        <option value="medium">中件</option>
        <option value="large">大件</option>
      </select>
      <input id="flt_tag" type="text" placeholder="按标签筛选,如:急单">
      <input id="flt_q" type="text" placeholder="搜标题/取件点">
      <button class="sm" id="btn_filter">筛选</button>
      <button class="sm ghost" id="btn_filter_clear">清除</button>
    </div>
    <div id="list"></div>
  </div>

  <!-- 常跑路线(顺路匹配用) -->
  <div class="card">
    <h3>我的常跑路线 <span style="font-size:12px;color:#888;font-weight:normal">设置后,顺路任务会优先推荐给你</span></h3>
    <div class="row">
      <div style="flex:3"><label>常去取件点/路线关键词(逗号分隔)</label>
        <input id="my_routes" placeholder="如:横琴, 菜鸟驿站, 十字门"></div>
      <div style="flex:1;display:flex;align-items:flex-end">
        <button id="btn_routes" style="width:100%">保存路线</button>
      </div>
    </div>
    <div id="routes_info" class="ok" style="margin-top:8px"></div>
  </div>
</main>

<!-- 通用弹窗容器 -->
<div id="modal_root"></div>
<footer>课程项目 · 虚拟悬赏 · 仅供演示</footer>
<script>
const $ = id => document.getElementById(id);
let ME = null;

/* ---------- 登录态:localStorage + cookie 双保险(关掉页面无需重新登录) ---------- */
function saveMe(u){
  ME = u;
  try{ localStorage.setItem('ce_user', JSON.stringify(u)); }catch(e){}
  document.cookie = 'ce_uid=' + u.id + '; max-age=31536000; path=/';
}
function loadMe(){
  let u = null;
  try{ u = JSON.parse(localStorage.getItem('ce_user') || 'null'); }catch(e){}
  if(!u || !u.id){
    const m = document.cookie.match(/(?:^|;\s*)ce_uid=(\d+)/);
    if(m) u = {id: parseInt(m[1], 10)};
  }
  return (u && u.id) ? u : null;
}
/* 界面按「已登录 / 未登录」切换:登录后不再显示姓名学号输入框 */
function paintMe(){
  const on = !!ME;
  $('row_id').style.display     = on ? 'none' : '';
  $('btn_login').style.display  = on ? 'none' : '';
  $('btn_recharge').style.display = on ? '' : 'none';
  $('btn_logout').style.display = on ? 'inline-block' : 'none';
  $('me_info').textContent = on
    ? ('✔ 已登录：' + (ME.name || '同步中…') + (ME.balance != null ? '（余额 ¥' + ME.balance + '）' : ''))
    : '';
}

function api(path, body){
  return fetch(path, {method: body?'POST':'GET',
    headers: {'Content-Type':'application/json'},
    body: body?JSON.stringify(body):undefined}).then(r=>{
      if(!r.ok) return r.json().then(e=>{throw new Error(e.detail||r.status)});
      return r.json();
    });
}

$('btn_login').onclick = async ()=>{
  try{
    const u = await api('/api/register', {name:$('me_name').value.trim(), student_id:$('me_sid').value.trim()});
    saveMe(u);
    paintMe();
    refresh();
  }catch(e){ alert('登录失败：'+e.message); }
};

// 充值:跳转到独立的加值页面 /recharge
// 退出登录:清除本地登录态 -> 回到未登录状态
$('btn_logout').onclick = ()=>{
  if(!confirm('确定要退出登录吗？')) return;
  try{ localStorage.removeItem('ce_user'); }catch(e){}
  document.cookie = 'ce_uid=; max-age=0; path=/';
  ME = null;
  location.reload();
};

$('btn_recharge').onclick = ()=>{
  if(!ME) return alert('请先登录');
  localStorage.setItem('ce_user', JSON.stringify(ME));
  location.href = '/recharge';
};



$('btn_post').onclick = async ()=>{
  if(!ME) return alert('请先登录');
  const addr = $('f_pickup').value.trim();
  if(!addr) return alert('请填写取件地址（具体到哪个驿站）');
  const body = {
    title:'帮取'+addr+'的包裹', description:$('f_desc').value.trim(),
    category:$('f_cat').value, size:$('f_size').value, pickup:addr,
    delivery:$('f_delivery').value, bounty:parseFloat($('f_bounty').value),
    content:$('f_content').value.trim(),
    tags:$('f_tags').value.split(',').map(s=>s.trim()).filter(Boolean),
    requester_id: ME.id, pickup_code:'CODE-'+Math.random().toString(36).slice(2,8)
  };
  try{
    const r = await api('/api/errands', body);
    if(r.audit_status === 'rejected'){ $('post_err').textContent='平台审核未通过：'+r.audit_note; }
    else { $('f_desc').value=''; $('f_content').value=''; $('f_tags').value=''; $('post_err').textContent=''; refresh(); }
  }
  catch(e){ $('post_err').textContent='发布失败：'+e.message; }
};

function esc(s){ return (s||'').replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

/* 发布时间:后端 SQLite datetime('now') 存的是 UTC 且无时区后缀,补 Z 后按北京时间渲染 */
function fmtTime(s){
  if(!s) return '';
  const d = new Date(String(s).replace(' ', 'T') + 'Z');
  if(isNaN(d)) return s;
  return d.toLocaleString('zh-CN', {timeZone:'Asia/Shanghai', hour12:false,
    year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
}

async function refresh(){
  if(ME){
    try{ const u = await api('/api/user/'+ME.id); saveMe(u); paintMe(); }catch(e){}
  }
  const params = new URLSearchParams();
  if(ME) params.set('viewer_id', ME.id);
  const cat=$('flt_cat').value, size=$('flt_size').value,
        tag=$('flt_tag').value.trim(), q=$('flt_q').value.trim();
  if(cat) params.set('category', cat);
  if(size) params.set('size', size);
  if(tag) params.set('tag', tag);
  if(q) params.set('q', q);
  const list = await api('/api/errands?' + params.toString());
  const mine   = ME ? list.filter(e=>e.requester_id===ME.id)  : [];
  const others = ME ? list.filter(e=>e.requester_id!==ME.id) : list;
  $('list').innerHTML = '';

  if(mine.length) $('list').innerHTML += '<b style="font-size:14px">我发布的：</b>';
  mine.forEach(e=>$('list').innerHTML += renderErrand(e, true));
  if(others.length) $('list').innerHTML += '<b style="font-size:14px;margin-top:10px;display:block">可接的：</b>';
  others.forEach(e=>$('list').innerHTML += renderErrand(e, false));
}

function renderErrand(e, mine){
  const badge = {open:'待接', accepted:'进行中', delivered:'已完成', cancelled:'已取消'}[e.status];
  const sizeLabel = {small:'小件', medium:'中件', large:'大件'}[e.size] || '';
  const auditTag = (e.audit_status === 'approved')
    ? '<span class="badge" style="background:#e5f6ec;color:#0a7">平台已审核</span>' : '';
  let act='';
  // 接单:只有别人发、还没被接的任务
  if(!mine && e.status==='open') act = `<button class="sm green" onclick="accept(${e.id})">接单</button>`;
  // 确认送达:只有当前 login 用户是 runner 才显示(点它自动结算悬赏)
  if(ME && e.runner_id===ME.id && e.status==='accepted') act = `<button class="sm" onclick="deliver(${e.id})">确认送达（结算悬赏）</button>`;
  // 发布者视角:给出明确的进度提示,避免"发完单没后续"的感觉
  if(mine && e.status==='open') act = '<span class="meta">⏳ 等待接单中…</span>';
  if(mine && e.status==='accepted') act = '<span class="meta">🏃 已有人接单,取件中…</span>';
  // 已完成:把结算结果写清楚
  if(e.status==='delivered') act = `<span class="ok">✅ 已完成 · 悬赏 ¥${e.bounty} 已结算给接单者</span>`;
  // 取件码:只有发布者(请求方)在已接后可见;顺路者接单后也需要看到取件码
  let code='';
  if(e.status==='accepted' && (mine || (ME && e.runner_id===ME.id)) && e.pickup_code)
    code = `<div class="meta">取件码：<b>${esc(e.pickup_code)}</b></div>`;
  // 标注是否本人接单
  const mineTag = (ME && e.runner_id===ME.id) ? ' <span class="badge" style="background:#e5f6ec;color:#0a7">我接的单</span>' : '';
  // 方案 C:审核详情(申报内容)仅「发布方」与「平台」可见;
  // 接单者(顺路者)看不到具体内容 —— 只看到 类别 + 尺寸 + 平台已审核标记。
  let contentHtml='';
  if(e.content && mine)
    contentHtml = `<div class="meta">申报内容(仅你与平台可见)：<b>${esc(e.content)}</b></div>`;
  const tagHtml = e.tags ? e.tags.split(',').filter(Boolean)
    .map(t=>`<span class="tag-pill">#${esc(t)}</span>`).join('') : '';
  // 聊天:任务双方(我的单有人接 / 我接的单)都能进
  const canChat = ME && e.runner_id && (mine || e.runner_id===ME.id);
  const chatBtn = canChat ? `<button class="sm ghost" style="margin-left:8px" onclick="openChat(${e.id})">💬 私聊(留痕)</button>` : '';
  // 顺路匹配:我发布的、还没人接的单,可以看推荐接单者排行
  const matchBtn = (mine && e.status==='open')
    ? `<button class="sm ghost" style="margin-left:8px" onclick="openMatch(${e.id})">🧭 顺路匹配</button>` : '';
  return `<div class="errand">
    <div><b>${esc(e.title)}</b> <span class="badge">${badge}</span>${auditTag}${mineTag}</div>
    <div class="meta">${esc(e.pickup)} → ${esc(e.delivery)} · 悬赏 ¥${e.bounty}${sizeLabel?' · '+sizeLabel:''} · 发布:${esc(e.requester||'')}</div>
    <div class="meta">🕒 发布时间:${fmtTime(e.created_at)}</div>
    ${tagHtml?`<div>${tagHtml}</div>`:''}
    ${e.description?`<div class="meta">${esc(e.description)}</div>`:''}
    ${contentHtml}
    ${code}
    <div style="margin-top:6px">${act}${chatBtn}${matchBtn}</div>
  </div>`;
}

async function accept(eid){
  try{ await api('/api/errands/'+eid+'/accept', {user_id:ME.id}); refresh(); }
  catch(e){ alert('接单失败：'+e.message); }
}
async function deliver(eid){
  try{
    const r = await api('/api/errands/'+eid+'/deliver', {user_id:ME.id});
    alert('✅ 已确认送达！\n\n悬赏 ¥'+r.bounty+' 已自动结算：\n· 从发布者账户扣除 ¥'+r.bounty
          +'\n· 已加到你的账户（模拟币）');
    refresh();
  }
  catch(e){ alert('确认失败：'+e.message); }
}

/* ---------- 任务1:筛选栏 ---------- */
$('btn_filter').onclick = ()=>refresh();
$('btn_filter_clear').onclick = ()=>{
  $('flt_cat').value=''; $('flt_size').value='';
  $('flt_tag').value=''; $('flt_q').value='';
  refresh();
};
['flt_cat','flt_size'].forEach(id=>$(id).addEventListener('change', ()=>refresh()));

/* ---------- 任务3:保存我的常跑路线 ---------- */
$('btn_routes').onclick = async ()=>{
  if(!ME) return alert('请先登录');
  const routes = $('my_routes').value.split(',').map(s=>s.trim()).filter(Boolean);
  try{
    const r = await api('/api/users/'+ME.id+'/routes', {user_id:ME.id, routes});
    $('routes_info').textContent = '✔ 已保存常跑路线:' + (r.routes.join('、') || '空');
  }catch(e){ alert('保存失败:'+e.message); }
};

/* ---------- 通用弹窗 ---------- */
function closeModal(){ $('modal_root').innerHTML=''; }
function showModal(title, innerHtml){
  $('modal_root').innerHTML =
    `<div class="modal-mask" onclick="if(event.target===this)closeModal()">
       <div class="modal">
         <h4><span>${esc(title)}</span><button class="sm ghost" onclick="closeModal()">关闭</button></h4>
         <div class="body">${innerHtml}</div>
       </div></div>`;
}

/* ---------- 任务2:任务内私聊(全程留痕) ---------- */
async function openChat(eid){
  if(!ME) return alert('请先登录');
  showModal('任务私聊(全程留痕)',
    `<div class="chat-log" id="chat_log">加载中…</div>
     <div class="row">
       <div style="flex:1"><input id="chat_input" placeholder="输入消息,回车发送"></div>
       <div><button id="chat_send">发送</button></div>
     </div>`);
  const loadChat = async ()=>{
    try{
      const msgs = await api('/api/messages?errand_id='+eid+'&viewer_id='+ME.id);
      $('chat_log').innerHTML = msgs.length ? msgs.map(m=>{
        const mine = m.from_id===ME.id;
        return `<div class="bubble ${mine?'me':'other'}"><span class="who">${esc(mine?'我':m.from_name)}</span>${esc(m.body)}</div>`;
      }).join('') : '<div class="meta" style="text-align:center;margin-top:20px">还没有消息,发条消息开始沟通吧</div>';
      $('chat_log').scrollTop = $('chat_log').scrollHeight;
    }catch(e){ $('chat_log').textContent = '加载失败:'+e.message; }
  };
  const sendChat = async ()=>{
    const body = $('chat_input').value.trim();
    if(!body) return;
    // 从列表里找到任务双方:我是发布方就发给接单者,反之发给发布方
    const all = await api('/api/errands?viewer_id='+ME.id);
    const errand = all.find(x=>x.id===eid);
    if(!errand) return alert('任务不存在');
    const toId = errand.requester_id===ME.id ? errand.runner_id : errand.requester_id;
    try{
      await api('/api/messages', {errand_id:eid, from_id:ME.id, to_id:toId, body});
      $('chat_input').value='';
      loadChat();
    }catch(e){ alert('发送失败:'+e.message); }
  };
  $('chat_send').onclick = sendChat;
  $('chat_input').addEventListener('keydown', ev=>{ if(ev.key==='Enter') sendChat(); });
  loadChat();
}

/* ---------- 任务3:顺路匹配排行弹窗 ---------- */
async function openMatch(eid){
  showModal('顺路接单者推荐', '<div id="match_box">计算顺路程度中…</div>');
  try{
    const r = await api('/api/match?errand_id='+eid);
    if(!r.matches.length){
      $('match_box').innerHTML = '<div class="meta">暂时没有设置过常跑路线、且与取件点顺路的同学。<br>可提醒同学们在下方「我的常跑路线」里填写常去地点。</div>';
      return;
    }
    $('match_box').innerHTML =
      `<div class="meta" style="margin-bottom:10px">取件点:<b>${esc(r.pickup)}</b> · 按顺路程度从高到低排行(同分时历史完成单多的优先)</div>` +
      r.matches.map((m,i)=>`
        <div class="match-row">
          <div><span class="rank-no">${i+1}</span><b>${esc(m.name)}</b>
            <div class="meta" style="margin-left:32px">命中路线:${m.matched_routes.map(esc).join('、')} · 历史完成 ${m.delivered_count} 单</div>
          </div>
          <span class="tag-pill">顺路分 ${m.score}</span>
        </div>`).join('');
  }catch(e){ $('match_box').textContent = '匹配失败:'+e.message; }
}

/* 进页面:自动恢复上次的登录态(关掉浏览器/微信后回来仍是登录状态) */
ME = loadMe();
paintMe();
refresh().catch(()=>{});
</script>
